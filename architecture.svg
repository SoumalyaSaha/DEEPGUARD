<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22e5ff"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#0a0e17"/>

  <text x="500" y="40" fill="#8fe9ff" font-size="20" font-weight="bold" text-anchor="middle">VERIFY.AI — Multi-Expert Detection Architecture v7.0.0</text>

  <!-- Upload -->
  <rect x="380" y="65" width="240" height="46" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="500" y="93" fill="#eaffff" font-size="14" text-anchor="middle">Image Upload</text>
  <line x1="500" y1="111" x2="500" y2="140" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="300" y="145" width="400" height="56" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="500" y="169" fill="#eaffff" font-size="14" text-anchor="middle">FastAPI Gateway — gateway/main.py</text>
  <text x="500" y="187" fill="#7fb8cc" font-size="11" text-anchor="middle">asyncio.gather() — parallel fan-out</text>

  <!-- Branch lines to 7 models -->
  <g stroke="#22e5ff" stroke-width="1.2">
    <line x1="500" y1="201" x2="70"  y2="240"/>
    <line x1="500" y1="201" x2="200" y2="240"/>
    <line x1="500" y1="201" x2="330" y2="240"/>
    <line x1="500" y1="201" x2="460" y2="240"/>
    <line x1="500" y1="201" x2="590" y2="240"/>
    <line x1="500" y1="201" x2="720" y2="240"/>
    <line x1="500" y1="201" x2="850" y2="240"/>
  </g>

  <!-- 7 model boxes -->
  <g font-size="12">
    <rect x="20"  y="240" width="110" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="75"  y="262" fill="#eaffff" text-anchor="middle">NPR</text>
    <text x="75"  y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5001</text>

    <rect x="150" y="240" width="110" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="205" y="262" fill="#eaffff" text-anchor="middle">UFD</text>
    <text x="205" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5004</text>

    <rect x="280" y="240" width="110" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="335" y="262" fill="#eaffff" text-anchor="middle">IAPL</text>
    <text x="335" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5005</text>

    <rect x="410" y="240" width="120" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="470" y="262" fill="#eaffff" text-anchor="middle">SDXL-detector</text>
    <text x="470" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5009</text>

    <rect x="545" y="240" width="110" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="600" y="262" fill="#eaffff" text-anchor="middle">umm-maybe</text>
    <text x="600" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5010</text>

    <rect x="670" y="240" width="110" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="725" y="262" fill="#eaffff" text-anchor="middle">CapCheck</text>
    <text x="725" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5011</text>

    <rect x="800" y="240" width="120" height="50" rx="6" fill="#101c2e" stroke="#22e5ff"/>
    <text x="860" y="262" fill="#eaffff" text-anchor="middle">Nonescape</text>
    <text x="860" y="278" fill="#7fb8cc" font-size="10" text-anchor="middle">:5013</text>
  </g>

  <!-- Converge lines -->
  <g stroke="#22e5ff" stroke-width="1.2">
    <line x1="75"  y1="290" x2="500" y2="335"/>
    <line x1="205" y1="290" x2="500" y2="335"/>
    <line x1="335" y1="290" x2="500" y2="335"/>
    <line x1="470" y1="290" x2="500" y2="335"/>
    <line x1="600" y1="290" x2="500" y2="335"/>
    <line x1="725" y1="290" x2="500" y2="335"/>
    <line x1="860" y1="290" x2="500" y2="335"/>
  </g>
  <line x1="500" y1="335" x2="500" y2="345" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Threshold box -->
  <rect x="320" y="350" width="360" height="50" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="500" y="380" fill="#eaffff" font-size="13" text-anchor="middle">Threshold @ 0.5 → binary vote per model</text>
  <line x1="500" y1="400" x2="500" y2="425" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Majority tally -->
  <rect x="280" y="430" width="440" height="56" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="500" y="454" fill="#eaffff" font-size="13" text-anchor="middle">Majority Tally</text>
  <text x="500" y="472" fill="#7fb8cc" font-size="11" text-anchor="middle">4+ of 7 (or of N responded) → verdict</text>

  <!-- Branch to two boxes -->
  <line x1="500" y1="486" x2="320" y2="520" stroke="#22e5ff" stroke-width="1.2"/>
  <line x1="500" y1="486" x2="680" y2="520" stroke="#22e5ff" stroke-width="1.2"/>
  <line x1="320" y1="520" x2="320" y2="530" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="520" x2="680" y2="530" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dotted line to feedback loop -->
  <line x1="720" y1="458" x2="900" y2="458" stroke="#22e5ff" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="900" y1="458" x2="900" y2="530" stroke="#22e5ff" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Left box: response JSON -->
  <rect x="120" y="535" width="400" height="70" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="320" y="562" fill="#eaffff" font-size="13" text-anchor="middle">Response JSON</text>
  <text x="320" y="580" fill="#7fb8cc" font-size="10" text-anchor="middle">verdict, confidence, model_breakdown[]</text>
  <text x="320" y="595" fill="#7fb8cc" font-size="10" text-anchor="middle">POST /api/detect response</text>

  <!-- Right box: persist -->
  <rect x="540" y="535" width="280" height="70" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="680" y="562" fill="#eaffff" font-size="13" text-anchor="middle">Persist Record</text>
  <text x="680" y="580" fill="#7fb8cc" font-size="10" text-anchor="middle">logs/detections_log.jsonl</text>
  <text x="680" y="595" fill="#7fb8cc" font-size="10" text-anchor="middle">indexed by verification_id</text>

  <!-- Feedback loop box (right side, dotted origin) -->
  <rect x="820" y="535" width="160" height="90" rx="8" fill="#151022" stroke="#ff9fd6" stroke-width="1.5"/>
  <text x="900" y="558" fill="#ffd6f0" font-size="11" text-anchor="middle">Feedback Loop</text>
  <text x="900" y="575" fill="#e0b8d6" font-size="9" text-anchor="middle">POST /api/feedback</text>
  <text x="900" y="590" fill="#e0b8d6" font-size="9" text-anchor="middle">sets disputed:true</text>
  <text x="900" y="605" fill="#e0b8d6" font-size="9" text-anchor="middle">on record</text>
  <text x="900" y="618" fill="#c98fbe" font-size="8" text-anchor="middle">zero paths touch weights</text>

  <!-- Converge down to audit log -->
  <line x1="320" y1="605" x2="500" y2="650" stroke="#22e5ff" stroke-width="1.2"/>
  <line x1="680" y1="605" x2="500" y2="650" stroke="#22e5ff" stroke-width="1.2"/>
  <line x1="500" y1="650" x2="500" y2="660" stroke="#22e5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Audit log box -->
  <rect x="270" y="665" width="460" height="60" rx="8" fill="#0e1a2b" stroke="#22e5ff" stroke-width="1.5"/>
  <text x="500" y="691" fill="#eaffff" font-size="14" text-anchor="middle">Prediction Audit Log / History API</text>
  <text x="500" y="709" fill="#7fb8cc" font-size="11" text-anchor="middle">GET /api/history — filter, search, paginate</text>

  <!-- Footer -->
  <text x="500" y="760" fill="#4a6a80" font-size="11" text-anchor="middle">Fully offline · No LLM / API calls · 7 frozen pretrained models · Nonescape strongest single model (69.6% acc)</text>
</svg>
